name: Windows installer check
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows desktop app workflow run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  install-and-reopen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: Study-Room-Windows-x64
          path: installer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Install and check actual Windows app
        shell: pwsh
        run: ./scripts/check-desktop-installer.ps1 -InstallerDirectory installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-installed-app-check
          path: release/desktop-smoke*.png
          if-no-files-found: warn
