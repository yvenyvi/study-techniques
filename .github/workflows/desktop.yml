name: Windows desktop app
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "src-tauri/**",
        "scripts/**",
        "tests-desktop/**",
        "tests/**",
        "playwright.desktop.config.ts",
        "package*.json",
        "vite.config.ts",
        "tsconfig.json",
        "app.html",
        "public/**",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "src-tauri/**",
        "scripts/**",
        "tests-desktop/**",
        "tests/**",
        "playwright.desktop.config.ts",
        "package*.json",
        "vite.config.ts",
        "tsconfig.json",
        "app.html",
        "public/**",
        ".github/workflows/desktop.yml",
      ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed installer and automatic update feed
        type: boolean
        default: false
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run test:release
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: npm run test:desktop:integration
      - name: Build Windows app (sign updates when configured)
        run: npm run desktop:build -- --bundles nsis
        env:
          STUDY_ROOM_UPDATER_PUBLIC_KEY: ${{ github.event_name != 'pull_request' && vars.STUDY_ROOM_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          STUDY_ROOM_REQUIRE_UPDATER: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '1' || '0' }}
      - run: npx playwright install chromium
      - run: npm run test:desktop:e2e
      - name: Prepare Windows download and update feed
        run: node scripts/prepare-desktop-release.mjs
        env:
          STUDY_ROOM_REQUIRE_UPDATER: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Study-Room-Windows-x64
          path: |
            release/Study-Room-Windows-x64-Setup.exe
            release/SHA256SUMS.txt
            release/Study-Room-Windows-x64-Setup.exe.sig
            release/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Install and verify the Windows package
        shell: pwsh
        run: ./scripts/check-desktop-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-window
          path: release/desktop-smoke*.png
          if-no-files-found: warn
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Study-Room-Windows-x64
          path: release
      - name: Publish signed Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test -s release/latest.json
          test -s release/Study-Room-Windows-x64-Setup.exe.sig
          gh release create "desktop-v$version" release/* --target "$GITHUB_SHA" --latest --title "Study Room $version" --notes-file docs/DESKTOP_RELEASE.md
