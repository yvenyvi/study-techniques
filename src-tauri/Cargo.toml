[package]
name = "study-room"
version = "1.1.1"
edition = "2021"
rust-version = "1.85"

[lib]
name = "study_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "study-room"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["devtools"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]

