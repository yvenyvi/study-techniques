name: study_room
description: An offline iPad workspace for psychology notes, reviewers, and focused goals.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.6.0
  dart_quill_delta: ^10.0.0
  pdfrx: ^2.9.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.3.0
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2
  archive: ^4.0.7
  crypto: ^3.0.6
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: StudySans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
